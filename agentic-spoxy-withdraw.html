<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AGENTIC SPOXY · Withdraw</title>
<style>body{font-family:system-ui,Arial,sans-serif;background:#060c18;color:#e8edf7;max-width:720px;margin:0 auto;padding:20px}button{width:100%;padding:14px;font-size:17px;font-weight:700;cursor:pointer;background:#ffd21f;border:0;border-radius:10px;margin:8px 0}button:disabled{opacity:.5}.card{border:1px solid #2b3a63;border-radius:12px;padding:16px;margin:16px 0;background:#121a33}.ok{color:#4dff88}.err{color:#ff8a8a}code{word-break:break-all}input{width:100%;padding:12px;font-size:15px;box-sizing:border-box}</style></head><body>
<h1>AGENTIC SPOXY · Withdraw</h1>
<h2>Withdraw hasil mint</h2>
<p>Hanya wallet owner kontrak yang bisa menarik saldo. Buka halaman ini di browser dApp wallet owner (Binance Wallet, MetaMask, OKX, Trust).</p>
<p id="detected">Mendeteksi wallet...</p>
<div class="card">
<label>Alamat kontrak AGENTIC SPOXY</label>
<input id="contract" placeholder="0x... (isi setelah deploy, atau dari ?contract= di link)">
<button id="check">Cek Saldo Kontrak</button>
<p>Saldo kontrak</p><p id="balance">…</p>
<p>Dana masuk ke wallet owner</p><p id="owner">…</p>
<p id="contractlink"></p>
</div>
<div class="card">
<button id="connect">Connect Wallet</button>
<p id="account">Belum connect.</p>
<button id="withdraw" disabled>Withdraw ke Wallet Owner</button>
<p id="status"></p><div id="result"></div>
</div>
<script>
let account=null, provider=null, contractAddr='';
const $ = id => document.getElementById(id);

function getProvider(){
  if(window.okxwallet) return {p: window.okxwallet, name: 'OKX'};
  if(window.ethereum){
    if(window.ethereum.isOkxWallet) return {p: window.ethereum, name: 'OKX'};
    if(window.ethereum.providers){ const okx = window.ethereum.providers.find(x => x.isOkxWallet); if(okx) return {p: okx, name: 'OKX'}; }
    return {p: window.ethereum, name: 'MetaMask / Ethereum'};
  }
  if(window.web3 && window.web3.currentProvider) return {p: window.web3.currentProvider, name: 'Web3'};
  return null;
}
async function connectWallet(){
  const found = getProvider();
  if(!found){ setStatus('Wallet tidak terdeteksi. Buka halaman ini di browser dApp wallet: di aplikasi OKX, Binance Wallet, MetaMask, atau Trust, buka Browser / Discover, lalu tempel link halaman ini.', 'err'); return null; }
  const provider = found.p;
  const accounts = await provider.request({method:'eth_requestAccounts'});
  const account = accounts[0];
  const chainId = await provider.request({method:'eth_chainId'});
  if(chainId !== '0x38'){
    try{ await provider.request({method:'wallet_switchEthereumChain', params:[{chainId:'0x38'}]}); }
    catch(e){ await provider.request({method:'wallet_addEthereumChain', params:[{chainId:'0x38', chainName:'BNB Smart Chain', nativeCurrency:{name:'BNB', symbol:'BNB', decimals:18}, rpcUrls:['https://bsc-dataseed.binance.org'], blockExplorerUrls:['https://bscscan.com']}] }); }
  }
  return {provider, account, walletName: found.name};
}
function setStatus(msg, cls){ const el=document.getElementById('status'); if(el){ el.textContent=msg; el.className=cls||''; } }
function showDetected(){
  const el=document.getElementById('detected'); if(!el) return;
  const f=getProvider(); el.textContent = f ? 'Wallet terdeteksi: ' + f.name + '. Klik Connect Wallet.' : 'Wallet belum terdeteksi. Buka halaman ini di browser dApp wallet (OKX / Binance / MetaMask / Trust).';
}

showDetected();
function getContractFromQuery(){ const q=new URLSearchParams(location.search).get('contract'); if(q && /^0x[0-9a-fA-F]{40}$/.test(q)){ $('contract').value=q; contractAddr=q; } }
getContractFromQuery();
function padAddress(addr){ return '0x000000000000000000000000' + addr.slice(2).toLowerCase(); }
async function callEth(to, data){ return await provider.request({method:'eth_call', params:[{to, data}, 'latest']}); }
function parseOwner(hex){ return '0x' + hex.slice(-40); }
function weiToBnb(weiHex){ const v=BigInt(weiHex); const whole=v/1000000000000000000n; const frac=v%1000000000000000000n; return whole.toString()+'.'+frac.toString().padStart(18,'0').replace(/0+$/,''); }
async function checkBalance(){
  contractAddr = $('contract').value.trim();
  if(!/^0x[0-9a-fA-F]{40}$/.test(contractAddr)){ setStatus('Alamat kontrak tidak valid.', 'err'); return; }
  if(!provider){ setStatus('Connect wallet dulu untuk cek saldo.', 'err'); return; }
  try{
    const bal = await provider.request({method:'eth_getBalance', params:[contractAddr, 'latest']});
    $('balance').textContent = weiToBnb(bal) + ' BNB';
    const ownerHex = await callEth(contractAddr, '0x8da5cb5b');
    $('owner').textContent = parseOwner(ownerHex);
    $('contractlink').innerHTML = '<a href="https://bscscan.com/address/'+contractAddr+'" target="_blank" rel="noopener">Kontrak di BscScan</a>';
    if(account && account.toLowerCase() === parseOwner(ownerHex).toLowerCase()){ $('withdraw').disabled=false; setStatus('Kamu adalah owner. Tombol Withdraw aktif.', 'ok'); }
    else if(account){ $('withdraw').disabled=true; setStatus('Wallet ini bukan owner kontrak, jadi tidak bisa withdraw.', 'err'); }
    else setStatus('Saldo dicek. Connect wallet owner untuk withdraw.', '');
  }catch(e){ setStatus('Gagal cek saldo: '+(e.message||e), 'err'); }
}
$('check').onclick = async () => { if(!provider){ try{ const r=await connectWallet(); if(!r) return; provider=r.provider; account=r.account; $('account').textContent='Wallet ('+r.walletName+'): '+account; }catch(e){ setStatus('Gagal connect: '+(e.message||e), 'err'); return; } } await checkBalance(); };
$('connect').onclick = async () => { try{ const r=await connectWallet(); if(!r) return; provider=r.provider; account=r.account; $('account').textContent='Wallet ('+r.walletName+'): '+account; setStatus('Wallet terhubung. Klik Cek Saldo Kontrak.', 'ok'); if(contractAddr) await checkBalance(); }catch(e){ setStatus('Gagal connect: '+(e.message||e), 'err'); } };
$('withdraw').onclick = async () => {
  if(!account || !contractAddr) return;
  try{
    setStatus('Meminta sign withdraw...');
    const txHash = await provider.request({method:'eth_sendTransaction', params:[{from:account, to:contractAddr, data:'0x3ccfd60b'}]});
    setStatus('Withdraw terkirim. Tx: '+txHash);
    let receipt=null; for(let i=0;i<60;i++){ await new Promise(r=>setTimeout(r,3000)); receipt=await provider.request({method:'eth_getTransactionReceipt', params:[txHash]}); if(receipt) break; }
    if(receipt){ $('result').innerHTML='<p class="ok"><b>WITHDRAW BERHASIL</b></p><p>Tx: <code>'+txHash+'</code></p><p><a href="https://bscscan.com/tx/'+txHash+'" target="_blank" rel="noopener">Lihat di BscScan</a></p>'; setStatus('Withdraw berhasil. Dana masuk ke wallet owner.', 'ok'); await checkBalance(); }
  }catch(e){ setStatus('Withdraw dibatalkan / gagal: '+(e.message||e), 'err'); }
};
</script></body></html>
